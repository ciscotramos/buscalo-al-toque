<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Búscalo al Toque</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3A73">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0B3A73; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; border: 0; background: #F6F5F0; }
</style>
</head>
<body>
<iframe
  id="app"
  title="Búscalo al Toque"
  src="https://script.google.com/macros/s/AKfycby31mC91YCEJtC0Ak8OEtNHLIwsDYmU_kbz7dzJIPeUKtznCQw0F18W9aRelsidgw1f8Q/exec"
  allow="web-share; clipboard-write; fullscreen; downloads"
  referrerpolicy="no-referrer-when-downgrade"></iframe>
<noscript>Activa JavaScript para usar Búscalo al Toque.</noscript>
<script>
/* Al cerrar sesión, la app pide recargar su marco: así vuelve al login sin salir de esta página
   (si saliera a script.google.com, reaparecería el aviso de Google). */
(function () {
  var f = document.getElementById('app'), url = f.getAttribute('src');
  window.addEventListener('message', function (e) {
    if (e.data && e.data.buscalo === 'logout') {
      f.src = 'about:blank';
      setTimeout(function () { f.src = url; }, 50);
    }
  });
})();
</script>
</body>
</html>
